<h2>Practice Product</h2>
<p>Running Shoes - $80</p>
<button id="add-to-cart-btn">Add to Cart</button>

<script>

  .addEventListener('click', function() {

    window.dataLayer.push({
      event: 'add_to_cart',
      ecommerce: {
        currency: 'USD',

        items: [{
          item_id: 'SHOES001',
          item_name: 'Running Shoes',
          price: 80,
          quantity: 1

      }

  });
</script>
